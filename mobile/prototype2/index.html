<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HLB 移动版原型 v3 · 真实存档</title>
<style>
  :root{
    --gold:#d4b66a; --gold-dim:#9c7a34; --gold-faint:#6e5a2e;
    --ink:#e8e0cc; --ink-dim:#a99f83; --ink-faint:#6f6752;
    --cell:#17123f; --cell-edge:#3a2f6b; --cell-edge-dim:#241d4d;
    --panel:#141210; --panel-edge:#3d3428; --bg:#0a0908;
    --q-normal:#c8c8c8; --q-magic:#6969ff; --q-rare:#ffff64; --q-set:#1fdc1f;
    --q-unique:#c7b377; --q-rune:#ffa033; --q-crafted:#ff8c1a; --q-gem:#b48ce8;
    --ok:#3fae5a; --bad:#d84545;
    --c:28px; /* grid cell */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#000;color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
    overflow:hidden;
  }
  /* stone-noise backdrop, same recipe as desktop */
  #app{
    height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;
    background:
      radial-gradient(120% 60% at 50% -10%,rgba(96,80,50,.28),transparent 60%),
      radial-gradient(100% 50% at 50% 115%,rgba(60,50,34,.22),transparent 60%),
      repeating-conic-gradient(rgba(255,255,255,.014) 0 .6deg,transparent .6deg 1.7deg),
      linear-gradient(168deg,#1b1815 0%,#12100e 45%,#0b0a09 100%);
  }
  /* ---------- top bar ---------- */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px;
    border-bottom:1px solid var(--panel-edge);
    background:linear-gradient(180deg,rgba(40,34,24,.55),rgba(20,17,12,.2));
  }
  header .ttl{font-family:Georgia,"Times New Roman",serif;letter-spacing:.14em;font-size:15px;color:var(--gold);text-transform:uppercase;white-space:nowrap;overflow:hidden;flex:0 1 auto}
  header .ttl b{color:var(--ink);font-weight:600;letter-spacing:.02em;text-transform:none;font-family:-apple-system,"PingFang SC",sans-serif;font-size:14px;display:inline-block;max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  header .save{margin-left:auto;font-size:11px;color:var(--ink-faint);display:flex;align-items:center;gap:5px;white-space:nowrap}
  header .save .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
  header .save.flash .dot{animation:blink .5s}
  @keyframes blink{0%{transform:scale(1.7)}100%{transform:scale(1)}}
  .backbtn{font-size:13px;color:var(--gold);border:1px solid var(--gold-faint);border-radius:4px;padding:4px 9px;background:rgba(0,0,0,.3);cursor:pointer;white-space:nowrap;flex:0 0 auto}
  /* ---------- screens ---------- */
  main{flex:1 1 auto;position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}
  .scrollable{overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* ---------- bottom tabs ---------- */
  nav.tabs{
    flex:0 0 auto;display:flex;border-top:1px solid var(--panel-edge);
    background:linear-gradient(0deg,rgba(30,26,18,.9),rgba(16,14,10,.85));
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--ink-dim);padding:7px 0 6px;cursor:pointer;
    font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  nav.tabs button .ic{font-size:19px;line-height:1;filter:grayscale(.4) opacity(.75)}
  nav.tabs button.on{color:var(--gold)}
  nav.tabs button.on .ic{filter:none}
  /* ---------- sub tabs / segmented ---------- */
  .subtabs{display:flex;gap:6px;padding:7px 12px 5px;flex:0 0 auto}
  .subtabs button,.seg button{
    flex:1;background:rgba(0,0,0,.35);border:1px solid var(--panel-edge);color:var(--ink-dim);
    border-radius:4px;padding:7px 0;font-size:13px;cursor:pointer;letter-spacing:.06em;
  }
  .subtabs button.on,.seg button.on{color:#0d0b06;background:linear-gradient(180deg,var(--gold),var(--gold-dim));border-color:var(--gold);font-weight:700}
  .seg{display:flex;gap:6px;padding:9px 12px 7px}
  /* ---------- generic panel ---------- */
  .panel{
    margin:8px 12px;border:1px solid var(--panel-edge);border-radius:6px;
    background:linear-gradient(180deg,rgba(30,26,20,.66),rgba(14,12,9,.66));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),inset 0 1px 0 rgba(212,182,106,.09),0 2px 10px rgba(0,0,0,.45);
    padding:10px;
  }
  .panel h3{
    font-family:Georgia,serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
    text-align:center;margin-bottom:8px;font-weight:600;
  }
  .hintline{font-size:11px;color:var(--ink-faint);text-align:center;padding:2px 16px 6px}
  /* ---------- grids & items ---------- */
  .gridwrap{position:relative;margin:0 auto}
  .gridbg{position:absolute;inset:0;border-radius:3px;
    background:
      repeating-linear-gradient(0deg,transparent 0 calc(var(--c) - 1px),rgba(0,0,0,.55) calc(var(--c) - 1px) var(--c)),
      repeating-linear-gradient(90deg,transparent 0 calc(var(--c) - 1px),rgba(0,0,0,.55) calc(var(--c) - 1px) var(--c)),
      var(--cell);
    border:1px solid var(--cell-edge-dim);
    box-shadow:inset 0 0 18px rgba(0,0,0,.6);
  }
  .item{
    position:absolute;border-radius:2px;border:1px solid var(--cell-edge);
    background:radial-gradient(120% 120% at 30% 20%,#241d5e,var(--cell) 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);
    z-index:2;
  }
  .item .g{font-size:calc(var(--c)*.52);line-height:1.05;pointer-events:none}
  .item .n{font-size:8.5px;line-height:1.1;color:var(--ink-dim);text-align:center;padding:0 1px;pointer-events:none;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item.q-magic{border-color:#3d3da8}.item.q-rare{border-color:#8a8a2e}
  .item.q-set{border-color:#177a17}.item.q-unique{border-color:#8a744a;background:radial-gradient(120% 120% at 30% 20%,#3a2c12,#241b08 70%)}
  .item.q-rune{border-color:#8a5a1e}.item.q-crafted{border-color:#8a5416}
  .item.q-gem{border-color:#5e4488}
  .item img.art{width:100%;height:100%;object-fit:contain;pointer-events:none}
  .vrow .vic img{width:100%;height:100%;object-fit:contain}
  #ghost img{width:100%;height:100%;object-fit:contain;pointer-events:none}
  .item .qty{position:absolute;right:2px;bottom:1px;font-size:9px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
  .item.drag-src{opacity:.3}
  .drop-hl{position:absolute;border:2px solid var(--ok);border-radius:3px;background:rgba(63,174,90,.22);z-index:3;pointer-events:none;display:none}
  .drop-hl.bad{border-color:var(--bad);background:rgba(216,69,69,.22)}
  #ghost{
    position:fixed;z-index:99;pointer-events:none;border-radius:2px;border:2px solid var(--gold);
    background:radial-gradient(120% 120% at 30% 20%,#2c2470,#17123f 70%);
    display:none;align-items:center;justify-content:center;font-size:22px;color:var(--ink);
    box-shadow:0 10px 28px rgba(0,0,0,.65);
  }
  #ghost.bad{border-color:var(--bad)}
  /* ---------- paper doll ---------- */
  .dollwrap{position:relative;margin:2px auto 0}
  .dollwrap svg.figure{position:absolute;left:50%;top:0;transform:translateX(-50%);opacity:.9;pointer-events:none}
  .slot{
    position:absolute;border-radius:3px;border:1px solid #2e2e2e;z-index:2;
    background:linear-gradient(135deg,rgba(26,26,26,.88),rgba(14,14,14,.88));
    box-shadow:inset 0 0 10px rgba(0,0,0,.75);
  }
  .slot .lab{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:9.5px;color:#555048;letter-spacing:.08em;pointer-events:none;padding:2px;
  }
  .slot .item{position:absolute;inset:0;border-radius:3px}
  .slot.filled{background:rgba(10,10,10,.35)}
  .slot.drop-ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),inset 0 0 10px rgba(63,174,90,.35)}
  .slot.drop-bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
  .swapctl{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:2px}
  .swapctl span{font-size:11px;color:var(--ink-faint);letter-spacing:.1em}
  .swapctl button{background:rgba(0,0,0,.4);border:1px solid var(--panel-edge);color:var(--ink-dim);border-radius:4px;padding:3px 12px;font-size:12px;cursor:pointer}
  .swapctl button.on{color:var(--gold);border-color:var(--gold-faint)}
  /* ---------- belt strip ---------- */
  .beltrow{display:flex;align-items:center;gap:8px;justify-content:center;padding:5px 12px 0}
  .beltrow .cap{font-size:11px;color:var(--ink-faint)}
  .beltcells{position:relative}
  .beltcells .item{--c:28px}
  .beltpanel{
    position:absolute;left:12px;right:12px;z-index:30;margin-top:4px;
    border:1px solid var(--gold-faint);border-radius:6px;padding:8px 10px;
    background:linear-gradient(180deg,rgba(34,29,20,.97),rgba(18,15,10,.97));display:none;
    box-shadow:0 14px 30px rgba(0,0,0,.6);
  }
  .screen .padwrap{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between}
  .dollzone{position:relative}
  .swapov{position:absolute;right:10px;top:2px;display:flex;gap:4px;z-index:6}
  .swapov button{background:rgba(0,0,0,.5);border:1px solid var(--panel-edge);color:var(--ink-dim);border-radius:4px;padding:4px 9px;font-size:11.5px;cursor:pointer}
  .swapov button.on{color:var(--gold);border-color:var(--gold-faint);background:rgba(50,40,16,.6)}
  .beltgold{display:flex;align-items:center;gap:9px;padding:6px 12px 0}
  .bg-gold{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink);cursor:pointer;border:1px solid var(--panel-edge);border-radius:6px;padding:5px 10px;background:linear-gradient(180deg,rgba(46,38,18,.55),rgba(22,18,10,.55))}
  .bg-gold b{color:var(--gold);font-variant-numeric:tabular-nums}
  .bg-gold span{font-size:11px;color:var(--gold);border:1px solid var(--gold-faint);border-radius:4px;padding:2px 6px}
  #trayhandle.droptarget{outline:2px solid var(--ok);outline-offset:-2px;background:linear-gradient(180deg,#5d4d1c,#3a2d10)}
  .beltpanel.on{display:block}
  .beltpanel .gridwrap{--c:28px}
  /* ---------- gold ---------- */
  .goldrow{
    display:flex;align-items:center;gap:8px;margin:6px 12px 0;padding:7px 12px;cursor:pointer;
    border:1px solid var(--panel-edge);border-radius:6px;
    background:linear-gradient(180deg,rgba(46,38,18,.6),rgba(22,18,10,.6));
    font-size:13px;
  }
  .goldrow .amt{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
  .goldrow .act{margin-left:auto;font-size:11.5px;color:var(--gold);border:1px solid var(--gold-faint);padding:3px 9px;border-radius:4px}
  .goldrow .cap2{font-size:10.5px;color:var(--ink-faint)}
  /* ---------- char list ---------- */
  .charcard{
    margin:10px 12px 0;padding:13px 14px;border:1px solid var(--panel-edge);border-radius:6px;cursor:pointer;
    background:linear-gradient(180deg,rgba(34,29,21,.75),rgba(16,14,10,.75));display:flex;gap:12px;align-items:center;
  }
  .charcard .ava{width:46px;height:46px;border-radius:4px;border:1px solid var(--gold-faint);display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 30%,#3a2f16,#171204)}
  .charcard .nm{font-size:16px;color:var(--ink);font-weight:600}
  .charcard .meta{font-size:12px;color:var(--ink-dim);margin-top:2px}
  .charcard .go{margin-left:auto;color:var(--gold);font-size:18px}
  /* ---------- attributes ---------- */
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:13px}
  .statgrid .k{color:var(--ink-dim)} .statgrid .v{text-align:right;font-variant-numeric:tabular-nums}
  .statgrid .v b{color:var(--gold);font-weight:600}
  .vitals{display:flex;gap:8px}
  .vital{flex:1;text-align:center;border:1px solid var(--panel-edge);border-radius:5px;padding:6px 2px;background:rgba(0,0,0,.3)}
  .vital .t{font-size:10px;color:var(--ink-faint);letter-spacing:.12em}
  .vital .n{font-size:15px;font-weight:700;margin-top:1px}
  .orb-hp{color:#ff7a6b}.orb-mp{color:#7aa2ff}.orb-st{color:#ffe28a}
  .skilltree{margin-bottom:9px}
  .skilltree h4{font-size:12px;color:var(--gold);letter-spacing:.08em;margin-bottom:4px;font-weight:600}
  .skillrow{display:flex;justify-content:space-between;font-size:12.5px;padding:2.5px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
  .skillrow .pts{font-variant-numeric:tabular-nums;color:var(--ink-dim)}
  .tg-seg{padding-left:0;padding-right:0}
  .tg-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,1fr);gap:8px 10px;width:min(100%,400px);margin:2px auto 0;aspect-ratio:3/3.9}
  .tg-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .tg-links path{fill:none;stroke:rgba(212,182,106,.16);stroke-width:2}
  .tg-links path.lit{stroke:rgba(212,182,106,.55)}
  .tg-tile{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 3px 5px;background:linear-gradient(180deg,rgba(38,32,22,.92),rgba(16,13,9,.92));border:1px solid var(--panel-edge);border-radius:6px;color:inherit;cursor:pointer;text-align:center;font:inherit}
  .tg-tile.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .tg-tile.dim{opacity:.45}
  .tg-name{font-size:10.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tg-lvl{font-size:19px;font-weight:700;color:#fff;line-height:1}
  .tg-lvl i{font-style:normal;font-size:11px;color:#7ee2a0;margin-left:2px;vertical-align:super}
  .tg-req{font-size:11px;color:var(--ink-dim)}
  .tg-detail{width:min(100%,400px);margin:10px auto 0;min-height:58px;border:1px solid var(--panel-edge);border-radius:6px;padding:8px 10px;background:rgba(0,0,0,.3)}
  .tg-dname{font-weight:700;color:var(--gold);margin-bottom:2px}
  .tg-dline{font-size:12.5px}
  .tg-dline.faint{color:var(--ink-faint)}
  .tg-ddesc{font-size:12.5px;color:var(--ink-dim);margin-top:3px;line-height:1.45}
  .tg-granted{width:min(100%,400px);margin:8px auto 0;font-size:12.5px;color:var(--ink-dim)}
  .skillrow .pts b{color:var(--ink)} .skillrow .pts .plus{color:var(--q-magic)}
  .bonusline{display:flex;justify-content:space-between;font-size:12.5px;padding:2.5px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
  .bonusline .bv{color:var(--gold);font-variant-numeric:tabular-nums}
  /* ---------- merc ---------- */
  .mercinfo{text-align:center;font-size:12.5px;line-height:1.55;color:var(--ink-dim)}
  .mercinfo .mn{color:var(--gold);font-size:14px}
  .emptybox{margin:26px 20px;text-align:center;color:var(--ink-faint);font-size:13px;line-height:1.9;
    border:1px dashed var(--panel-edge);border-radius:8px;padding:26px 14px}
  /* ---------- stash ---------- */
  .charchips{display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto;flex:0 0 auto}
  .charchips button{flex:0 0 auto;background:rgba(0,0,0,.35);border:1px solid var(--panel-edge);color:var(--ink-dim);border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer}
  .charchips button.on{color:var(--gold);border-color:var(--gold-faint)}
  .tabchips{display:flex;gap:5px;padding:8px 12px 0;overflow-x:auto;flex:0 0 auto}
  .tabchips button{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--panel-edge);color:var(--ink-dim);border-radius:4px;padding:5px 0;font-size:11.5px;cursor:pointer;white-space:nowrap}
  .tabchips button.on{color:var(--gold);border-color:var(--gold-faint);background:rgba(60,48,20,.35)}
  .stash-scroll{flex:1;overflow-y:auto;padding-bottom:14px}
  /* ---------- vault ---------- */
  .vsearch{display:flex;gap:7px;padding:10px 12px 0}
  .vsearch input{
    flex:1;background:rgba(0,0,0,.45);border:1px solid var(--panel-edge);border-radius:5px;color:var(--ink);
    padding:9px 11px;font-size:14px;outline:none;
  }
  .vsearch input:focus{border-color:var(--gold-faint)}
  .vsearch .fbtn{background:rgba(0,0,0,.35);border:1px solid var(--panel-edge);color:var(--gold);border-radius:5px;padding:0 13px;font-size:13px;cursor:pointer}
  .fchips{display:flex;gap:5px;padding:8px 12px 0;overflow-x:auto}
  .fchips button{flex:0 0 auto;background:rgba(0,0,0,.3);border:1px solid var(--panel-edge);color:var(--ink-dim);border-radius:16px;padding:4px 11px;font-size:12px;cursor:pointer}
  .fchips button.on{color:var(--gold);border-color:var(--gold-faint)}
  .vrow{
    display:flex;gap:10px;align-items:center;margin:7px 12px 0;padding:8px 10px;cursor:pointer;
    border:1px solid var(--panel-edge);border-radius:6px;background:linear-gradient(180deg,rgba(28,24,17,.6),rgba(14,12,9,.6));
  }
  .vrow .vic{width:40px;height:40px;flex:0 0 auto;border-radius:3px;border:1px solid var(--cell-edge);background:radial-gradient(120% 120% at 30% 20%,#241d5e,var(--cell) 70%);display:flex;align-items:center;justify-content:center;font-size:19px}
  .vrow .vn{font-size:13.5px;font-weight:600}
  .vrow .vm{font-size:11px;color:var(--ink-dim);margin-top:1px}
  .vrow .vl{margin-left:auto;text-align:right;font-size:11px;color:var(--ink-faint);white-space:nowrap}
  /* ---------- settings ---------- */
  .setrow{display:flex;align-items:center;gap:10px;margin:9px 12px 0;padding:12px;border:1px solid var(--panel-edge);border-radius:6px;background:rgba(0,0,0,.28)}
  .setrow .st{font-size:14px}.setrow .sd{font-size:11.5px;color:var(--ink-dim);margin-top:1px}
  .setrow .tag{margin-left:auto;font-size:10.5px;color:var(--ink-faint);border:1px solid var(--panel-edge);border-radius:10px;padding:2px 8px;white-space:nowrap}
  .setrow .tag.live{color:var(--ok);border-color:rgba(63,174,90,.5)}
  /* ---------- tray ---------- */
  #trayhandle{
    position:absolute;right:0;top:44%;z-index:40;cursor:pointer;
    background:linear-gradient(180deg,#4a3a14,#2c2210);border:1px solid var(--gold-faint);border-right:none;
    border-radius:8px 0 0 8px;color:var(--gold);padding:13px 5px 13px 7px;
    writing-mode:vertical-rl;font-size:12px;letter-spacing:.3em;
    box-shadow:-3px 4px 14px rgba(0,0,0,.5);
  }
  #trayhandle .cnt{
    writing-mode:horizontal-tb;background:var(--gold);color:#191204;border-radius:9px;
    font-size:10.5px;font-weight:800;padding:1px 5px;margin-top:6px;display:inline-block;letter-spacing:0;
  }
  #trayhandle.bump{animation:bump .35s}
  @keyframes bump{40%{transform:translateX(-7px)}}
  #scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:49;display:none}
  #scrim.on{display:block}
  #tray{
    position:absolute;top:0;right:0;bottom:0;width:78%;max-width:330px;z-index:50;
    background:linear-gradient(270deg,#1d1913,#12100c);border-left:1px solid var(--gold-faint);
    transform:translateX(102%);transition:transform .28s ease;display:flex;flex-direction:column;
    box-shadow:-14px 0 34px rgba(0,0,0,.6);
  }
  #tray.on{transform:none}
  #tray .th{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 8px;display:flex;align-items:baseline;gap:8px}
  #tray .th .tt{font-family:Georgia,serif;letter-spacing:.2em;color:var(--gold);font-size:14px}
  #tray .th .tx{margin-left:auto;color:var(--ink-dim);font-size:20px;background:none;border:none;cursor:pointer;padding:2px 6px}
  #tray .tsub{font-size:11.5px;color:var(--ink-faint);padding:0 14px 8px;line-height:1.6}
  #traybody{flex:1;overflow-y:auto;padding:4px 12px 16px}

function rectFree(items, x, y, w, h, ignoreId){
  return !items.some(o=> o.id!==ignoreId && x < o.x+o.w && o.x < x+w && y < o.y+o.h && o.y < y+h);
}
const GRIDS = {
  inv:  {cols:10, rows:4,  cell:CELL, get:()=>cur().inv},
  cube: {cols:3,  rows:4,  cell:CELL, get:()=>cur().cube},
  personal:{cols:10, rows:10, cell:CELL, get:()=>S.personal[S.stashChar]},

};
function findSpot(area, w, h){
  const g = GRIDS[area]; if(!g) return null;
  const items = g.get();
  for(let y=0; y<=g.rows-h; y++) for(let x=0; x<=g.cols-w; x++)
    if(rectFree(items,x,y,w,h)) return {x,y};
  return null;
}
function itemEl(item, area, cell){
  const d = document.createElement('div');
  d.className = 'item q-'+item.q; d.dataset.area = area; d.dataset.id = item.id;
  d.style.width = item.w*cell-2+'px'; d.style.height = item.h*cell-2+'px';
  d.innerHTML = item.art? '<img class="art" src="'+ART+item.art+'.png" alt="">' + (item.qty? '<div class="qty">'+item.qty+'</div>':'')
    : '<div class="g">'+esc(item.g)+'</div>' + (item.h>=2||item.w>=2 ? '<div class="n">'+esc(item.name.split(' ·')[0])+'</div>' : '') + (item.qty? '<div class="qty">'+item.qty+'</div>':'');
  return d;
}

function packTray(){
  const cols=6; const occ=[]; const pos={};
  const free=(x,y,w,h)=> !occ.some(o=> x<o.x+o.w && o.x<x+w && y<o.y+o.h && o.y<y+h);
  S.tray.forEach(o=>{ let done=false;
    for(let y=0;!done;y++) for(let x=0;x<=cols-o.w;x++){ if(free(x,y,o.w,o.h)){ pos[o.id]={x,y}; occ.push({x,y,w:o.w,h:o.h}); done=true; break; } }
  });
  return pos;
}
function renderTray(){
  $('#traycnt').textContent = S.tray.length;
  const body = $('#traybody');
  if(!S.tray.length){ body.innerHTML = '<div style="color:var(--ink-faint);font-size:12.5px;line-height:1.8;padding:8px 2px">托盘是空的。<br>在任意网格里<b style="color:var(--gold)">双击</b>一件物品，或把物品<b style="color:var(--gold)">拖</b>到右侧把手上，就能放进来。</div>'; return; }
  const pos = packTray();
  const rows = Math.max(...S.tray.map(o=> pos[o.id].y + o.h));
  body.innerHTML = '<div class="gridwrap" data-area="traygrid" style="width:'+(6*TRAYCELL)+'px;height:'+(rows*TRAYCELL)+'px;position:relative;margin:0"><div class="gridbg" style="--c:'+TRAYCELL+'px"></div></div>';
  const wrap = body.querySelector('.gridwrap');
  S.tray.forEach(o=>{ const el=itemEl(o,'tray',TRAYCELL); el.style.left=(pos[o.id].x*TRAYCELL+1)+'px'; el.style.top=(pos[o.id].y*TRAYCELL+1)+'px'; wrap.appendChild(el); });
}

/* ================= item location ================= */
function locateItem(area, id){
  id = +id;
  const arr = a => { const i = a.findIndex(o=>o && o.id===id); return i<0? null : {item:a[i], arr:a, idx:i, remove(){ a.splice(i,1); }}; };
  if(area==='doll'||area==='swap'){ const src = area==='swap'? cur().swap : cur().doll;
    for(const loc in src) if(src[loc] && src[loc].id===id) return {item:src[loc], loc, remove(){ src[loc]=null; }};
    return null; }
  if(area==='merc'){ const src = cur().merc.doll;
    for(const loc in src) if(src[loc] && src[loc].id===id) return {item:src[loc], loc, remove(){ src[loc]=null; }};
    return null; }
  if(area==='belt'){ const a = cur().belt; const i = a.findIndex(o=>o && o.id===id); return i<0? null : {item:a[i], idx:i, remove(){ a[i]=null; }}; }
  if(area==='inv') return arr(cur().inv);
  if(area==='cube') return arr(cur().cube);
  if(area==='personal') return arr(S.personal[S.stashChar]);
  if(area==='shared') return arr(S.shared[S.sharedTab]);
  if(area==='tray') return arr(S.tray);
  if(area==='vault') return arr(S.vault);
  return null;
}
function toTray(loc){
  const item = loc.item; loc.remove(); S.tray.push(item); flashSave(); render();
  const h = $('#trayhandle'); h.classList.remove('bump'); void h.offsetWidth; h.classList.add('bump');
  toast('「'+esc(item.name)+'」已放入托盘（已落盘）');
}
function fromTrayTo(area, id){
  if(!area || !GRIDS[area]){ toast('当前页面没有网格区<br>切到装备页 / 仓库页再双击取出'); return; }
  const item = id!=null ? S.tray.find(o=>o.id===+id) : S.tray[S.tray.length-1]; if(!item) return;
  const spot = findSpot(area, item.w, item.h);
  if(!spot){ toast('放不下：当前网格没有足够空间'); return; }
  S.tray.splice(S.tray.indexOf(item),1);
  item.x = spot.x; item.y = spot.y; GRIDS[area].get().push(item);
  closeTray(); flashSave(); render();
  toast('「'+esc(item.name)+'」已放入'+({inv:'背包',cube:'方块',personal:'个人仓库',shared:'共享仓库'})[area]);
}
/* ================= sheets ================= */
function openSheet(html){
  closeSheet();
  const w = document.createElement('div'); w.className='sheetwrap on'; w.id='sheetwrap';
  w.innerHTML = '<div class="bg"></div><div class="sheet"><div class="grab"></div>'+html+'</div>';
  $('#app').appendChild(w); w.querySelector('.bg').onclick = closeSheet;
  return w;
}
function closeSheet(){ const w=$('#sheetwrap'); if(w) w.remove(); }
const AREA_LABEL = {doll:'装备',swap:'副手',merc:'佣兵',belt:'腰带',inv:'背包',cube:'方块',personal:'个人仓库',shared:'共享仓库',tray:'托盘',vault:'宝库'};
function openItemSheet(area, id){
  const loc = locateItem(area, id); if(!loc) return;
  const o = loc.item;
  S.sheetRef = {area, id:o.id};
  let btns = '';
  if(area==='tray') btns += '<button class="primary" id="sh-back">放回当前网格</button>';
  else btns += '<button class="primary" id="sh-tray">放入托盘</button>';
  if(o.fit && (area!=='doll' && area!=='swap' && area!=='merc')) btns += '<button id="sh-equip">装备到空槽</button>';
  btns += '<button id="sh-move">移动到…</button><button id="sh-export">导出 .d2i</button><button class="danger" id="sh-del">删除</button>';
  const w = openSheet(
    '<h3 class="q-'+o.q+'-t">'+esc(o.name)+(o.eth?'（无形）':'')+'</h3>'+
    '<div class="base">'+esc(o.base||QNAME[o.q])+' · 位于'+AREA_LABEL[area]+(o.lvl>1? ' · 需要等级 '+o.lvl : '')+'</div>'+
    (o.props.length? '<div class="props">'+o.props.map(p=>'<div>'+esc(p)+'</div>').join('')+'</div>':'')+
    (o.sock? '<div class="sock">'+esc(o.sock)+'</div>':'')+
    '<div class="btns">'+btns+'</div>');
  const q = s => w.querySelector(s);
  if(q('#sh-tray')) q('#sh-tray').onclick = ()=>{ closeSheet(); const l=locateItem(area,id); if(l) toTray(l); };
  if(q('#sh-back')) q('#sh-back').onclick = ()=>{ closeSheet(); fromTrayTo(S.activeGrid); };
  if(q('#sh-equip')) q('#sh-equip').onclick = ()=>{ closeSheet(); tryEquip(area, id); };
  if(q('#sh-move')) q('#sh-move').onclick = ()=> openMoveSheet(area, id);
  if(q('#sh-export')) q('#sh-export').onclick = ()=>{ closeSheet(); toast('已导出到 Documents/exports/<br>'+esc(o.name)+'.d2i（演示）'); flashSave(); };
  if(q('#sh-del')) q('#sh-del').onclick = ()=>{ const l=locateItem(area,id); if(l){ l.remove(); } closeSheet(); flashSave(); render(); toast('已删除「'+esc(o.name)+'」（演示：真实版删除前会再确认）'); };
}
function tryEquip(area, id){
  const loc = locateItem(area, id); if(!loc) return;
  const o = loc.item; if(!o.fit){ toast('这件物品不能装备'); return; }
  if(S.tab!=='char'){ toast('请到角色页再装备'); return; }
  const VIEW = { doll: cur().doll, swap: cur().swap };
  for(const viewName of ['doll','swap']){
    const src = VIEW[viewName];
    for(const f of o.fit){ if(src[f]===null || src[f]===undefined){ loc.remove(); src[f]=o; flashSave(); S.charView='detail'; S.sub='equip'; S.swapView = viewName==='swap'; render(); toast('已装备「'+esc(o.name)+'」'); return; } }
  }
  toast('对应槽位都被占用了<br>用拖动直接换装，或先把原装备放进托盘');
}
function openMoveSheet(area, id){
  const loc = locateItem(area, id); if(!loc) return;
  const targets = [['inv','背包'],['cube','方块'],['personal','个人仓库'],['shared','共享仓库'],['vault','宝库'],['tray','托盘']].filter(t=>t[0]!==area);
  const w = openSheet('<h3>移动「'+esc(loc.item.name)+'」到…</h3><div class="btns">'+
    targets.map(t=>'<button data-tgt="'+t[0]+'" class="wide" style="text-align:left;padding-left:14px">'+t[1]+'</button>').join('')+'</div>');
  w.querySelectorAll('[data-tgt]').forEach(b=> b.onclick = ()=>{
    const l = locateItem(area, id); if(!l) { closeSheet(); return; }
    const o = l.item, tgt = b.dataset.tgt;
    if(tgt==='tray'){ closeSheet(); toTray(l); return; }
    if(tgt==='vault'){ l.remove(); S.vault.push(o); }
    else { const spot = findSpot(tgt, o.w, o.h); if(!spot){ toast('放不下：'+b.textContent+'没有足够空间'); return; } l.remove(); o.x=spot.x; o.y=spot.y; GRIDS[tgt].get().push(o); }
    closeSheet(); flashSave(); render(); toast('已移动到'+b.textContent);
  });
}
/* ---- gold ---- */
function goldAccounts(){
  const bankChar = S.tab==='stash' ? S.chars[S.stashChar] : cur();
  return [
    {key:'inv', label: cur().name+' 携带', cap: 100000 + cur().level*10000, get:()=>cur().goldInv, set:v=>{cur().goldInv=v;}},
    {key:'bank', label: bankChar.name+' 个人仓库', cap: 2500000, get:()=>bankChar.goldBank, set:v=>{bankChar.goldBank=v;}},
    {key:'shared', label:'共享仓库（金池）', cap: 999999999, get:()=>S.goldShared, set:v=>{S.goldShared=v;}},
    {key:'vault', label:'宝库金池', cap: 999999999, get:()=>S.goldVault, set:v=>{S.goldVault=v;}},
  ];
}
function openGoldSheet(fromKey){
  const accs = goldAccounts();
  const from = accs.find(a=>a.key===fromKey); if(!from) return;
  let destKey = accs.find(a=>a.key!==fromKey).key;
  const w = openSheet(
    '<h3>🪙 金币转移</h3><div class="base">从「'+from.label+'」转出 · 余额 <b style="color:var(--gold)">'+fmt(from.get())+'</b></div>'+
    '<div class="frow"><div class="fl">转入</div><div class="destchips">'+accs.filter(a=>a.key!==fromKey).map(a=>'<button data-dest="'+a.key+'">'+a.label+'</button>').join('')+'</div></div>'+
    '<div class="gamount"><input id="gamt" type="number" inputmode="numeric" placeholder="输入金额"><button id="gmax">最大</button></div>'+
    '<div class="gbal" id="gbal"></div>'+
    '<div class="btns"><button class="primary wide" id="gok">确认转移</button></div>');
  const bal = ()=>{ const d = accs.find(a=>a.key===destKey);
    w.querySelector('#gbal').innerHTML = '目标「'+d.label+'」当前 <b>'+fmt(d.get())+'</b>'+(d.cap<999999999? ' · 上限 <b>'+fmt(d.cap)+'</b> · 还可存 <b>'+fmt(Math.max(0,d.cap-d.get()))+'</b>':' · 无上限'); };
  const chips = ()=> w.querySelectorAll('[data-dest]').forEach(b=> b.classList.toggle('on', b.dataset.dest===destKey));
  w.querySelectorAll('[data-dest]').forEach(b=> b.onclick=()=>{ destKey=b.dataset.dest; chips(); bal(); });
  w.querySelector('#gmax').onclick = ()=>{ const d = accs.find(a=>a.key===destKey); w.querySelector('#gamt').value = Math.min(from.get(), Math.max(0, d.cap-d.get())); };
  w.querySelector('#gok').onclick = ()=>{ const d = accs.find(a=>a.key===destKey);
    let n = Math.floor(+w.querySelector('#gamt').value || 0);
    n = Math.max(0, Math.min(n, from.get(), d.cap - d.get()));
    if(n<=0){ toast('没有可转移的金额（检查余额与上限）'); return; }
    from.set(from.get()-n); d.set(d.get()+n); closeSheet(); flashSave(); render(); toast('已转移 '+fmt(n)+' 金币到「'+d.label+'」'); };
  chips(); bal();
}
/* ---- vault filter ---- */
function openFilterSheet(){
  const f = S.vaultFilter;
  const w = openSheet('<h3>宝库筛选（参考 GoMule）</h3>'+
    '<div class="frow"><div class="fl">品质</div><div class="destchips">'+QCHIPS.map(c=>'<button data-fq="'+c[0]+'" class="'+(f.q===c[0]?'on':'')+'">'+c[1]+'</button>').join('')+'</div></div>'+
    '<div class="frow"><div class="fl">类型</div><div class="destchips">'+CATCHIPS.map(c=>'<button data-fc="'+c[0]+'" class="'+(f.cat===c[0]?'on':'')+'">'+c[1]+'</button>').join('')+'</div></div>'+
    '<div class="frow"><div class="fl">需要等级区间</div><div class="rng"><input id="flmin" type="number" placeholder="最低" value="'+f.lvlMin+'"><span>—</span><input id="flmax" type="number" placeholder="最高" value="'+f.lvlMax+'"></div></div>'+
    '<div class="frow"><div class="fl">其他条件</div><div class="togrow"><label><input type="checkbox" id="feth" '+(f.eth?'checked':'')+'> 无形</label><label><input type="checkbox" id="fsock" '+(f.sock?'checked':'')+'> 带凹槽</label></div></div>'+
    '<div class="frow" style="font-size:11.5px;color:var(--ink-faint);line-height:1.6">二期：一期先做以上条件；属性条件行（如「快速施法 ≥ 20%」）的构建器放二期。</div>'+
    '<div class="btns"><button id="fclear">清空条件</button><button class="primary" id="fapply">应用</button></div>');
  w.querySelectorAll('[data-fq]').forEach(b=> b.onclick=()=>{ f.q=b.dataset.fq; openFilterSheet(); });
  w.querySelectorAll('[data-fc]').forEach(b=> b.onclick=()=>{ f.cat=b.dataset.fc; openFilterSheet(); });
  w.querySelector('#fclear').onclick = ()=>{ S.vaultFilter = {text:S.vaultFilter.text, q:'all', cat:'all', lvlMin:'', lvlMax:'', eth:false, sock:false}; closeSheet(); render(); };
  w.querySelector('#fapply').onclick = ()=>{ f.lvlMin=w.querySelector('#flmin').value; f.lvlMax=w.querySelector('#flmax').value; f.eth=w.querySelector('#feth').checked; f.sock=w.querySelector('#fsock').checked; closeSheet(); render(); };
}
/* ================= gestures: tap / double-tap / drag ================= */
const DRAGGABLE = ['doll','swap','merc','belt','inv','cube','personal','shared','tray'];
let P = null, tapTimer = null, lastTap = {key:null, t:0};
const ghost = $('#ghost');
function slotItem(area, loc){ return area==='merc' ? cur().merc.doll[loc] : area==='swap' ? cur().swap[loc] : cur().doll[loc]; }
function slotSet(area, loc, item){ if(area==='merc') cur().merc.doll[loc]=item; else if(area==='swap') cur().swap[loc]=item; else cur().doll[loc]=item; }
function normLoc(l){ return l.replace(/s$/,''); }
function slotCheck(item, area, loc, src){
  if(!item.fit || !item.fit.map(normLoc).includes(normLoc(loc))) return {ok:false, reason:'「'+item.name+'」放不到这个槽位'};
  if(area==='merc' && loc==='lh') return {ok:false, reason:'第二幕佣兵不能使用盾牌'};
  if(loc==='belt'){ const used = cur().belt.reduce((m,o,i)=> o? Math.max(m, Math.floor(i/4)+1):m, 0);
    if((item.beltBoxes||4) < used*4) return {ok:false, reason:'腰带上层还有药水，先清空再换腰带'}; }
  const occ = slotItem(area, loc);
  if(!occ) return {ok:true};
  if(src && (src.area==='doll'||src.area==='swap'||src.area==='merc')){
    if(occ.fit && occ.fit.map(normLoc).includes(normLoc(src.loc))) return {ok:true, swap:true};
    return {ok:false, reason:'槽位已被占用，且不能直接对换'};
  }
  if(src && src.gridItem){
    const gi = src.gridItem;
    if(occ.w<=gi.w && occ.h<=gi.h) return {ok:true, swap:true};
  }
  return {ok:false, reason:'槽位已被占用 · 先把原装备拖走或放进托盘'};
}
function gridCheck(area, item, x, y, ignoreId){
  const g = GRIDS[area]; if(!g) return {ok:false};
  const rows = area==='belt' ? beltRows() : g.rows;
  if(x<0 || y<0 || x+item.w>g.cols || y+item.h>rows) return {ok:false, reason:'超出区域边界'};
  if(!rectFree(g.get(), x, y, item.w, item.h, ignoreId)) return {ok:false, reason:'位置被占用'};
  return {ok:true};
}
document.addEventListener('pointerdown', e=>{
  const el = e.target.closest('[data-area][data-id]'); if(!el) return;
  P = {el, area:el.dataset.area, id:+el.dataset.id, x0:e.clientX, y0:e.clientY, pid:e.pointerId, dragging:false};
});
document.addEventListener('pointermove', e=>{
  if(!P || e.pointerId!==P.pid) return;
  if(!P.dragging){
    if(Math.hypot(e.clientX-P.x0, e.clientY-P.y0) > 9){
      if(!DRAGGABLE.includes(P.area)){ P=null; return; }
      if(!startDrag(e)){ P=null; return; }
    } else return;
  }
  e.preventDefault(); moveDrag(e);
}, {passive:false});
document.addEventListener('pointerup', e=>{
  if(!P || e.pointerId!==P.pid) return;
  const was = P; P = null;
  if(was.dragging){ endDrag(e); return; }
  const key = was.area+':'+was.id, now = Date.now();
  if(lastTap.key===key && now-lastTap.t<330){ lastTap={key:null,t:0}; clearTimeout(tapTimer); dblAction(was.area, was.id); }
  else { lastTap={key, t:now}; clearTimeout(tapTimer); tapTimer=setTimeout(()=>openItemSheet(was.area, was.id), 250); }
});
document.addEventListener('pointercancel', e=>{ if(P && P.dragging) cancelDrag(); P=null; });
function startDrag(e){
  const loc = locateItem(P.area, P.id); if(!loc) return false;
  const r = P.el.getBoundingClientRect();
  P.dragging = true; P.item = loc.item; P.fromTray = P.area==='tray';
  P.offX = e.clientX - r.left; P.offY = e.clientY - r.top; P.gw = r.width; P.gh = r.height;
  P.srcLoc = loc.loc || null; P.srcGridItem = (P.area==='inv'||P.area==='cube'||P.area==='personal'||P.area==='shared') ? loc.item : null;
  if(loc.item.art){ ghost.innerHTML = '<img src="'+ART+loc.item.art+'.png" alt="">'; } else { ghost.textContent = loc.item.g; } ghost.style.width = r.width+'px'; ghost.style.height = r.height+'px';
  ghost.style.display = 'flex'; ghost.classList.remove('bad');
  P.el.classList.add('drag-src'); P.el.style.pointerEvents = 'none';
  if(P.fromTray) closeTray(); /* 托盘自动收起，不遮挡落点 */
  moveDrag(e);
  return true;
}
function clearHl(){
  main.querySelectorAll('.slot.drop-ok,.slot.drop-bad').forEach(s=>s.classList.remove('drop-ok','drop-bad'));
  document.querySelectorAll('.drop-hl').forEach(h=> h.style.display='none');
  $('#trayhandle').classList.remove('droptarget');
}
function moveDrag(e){
  ghost.style.left = (e.clientX - P.offX)+'px'; ghost.style.top = (e.clientY - P.offY)+'px';
  clearHl(); P.drop = null;
  const hit = document.elementFromPoint(e.clientX, e.clientY); if(!hit) { ghost.classList.add('bad'); return; }
  const handle = hit.closest && hit.closest('#trayhandle');
  if(handle && !P.fromTray){ P.drop = {kind:'tray', ok:true}; handle.classList.add('droptarget'); ghost.classList.remove('bad'); return; }
  const slot = hit.closest && hit.closest('.slot[data-droptarget]');
  if(slot){
    const area = slot.dataset.area, loc = slot.dataset.loc;
    const chk = slotCheck(P.item, area, loc, {area:P.area, loc:P.srcLoc, gridItem:P.srcGridItem});
    P.drop = {kind:'slot', area, loc, ok:chk.ok, swap:!!chk.swap, reason:chk.reason};
    slot.classList.add(chk.ok? 'drop-ok':'drop-bad'); ghost.classList.toggle('bad', !chk.ok); return;
  }
  const wrap = hit.closest && hit.closest('.gridwrap[data-droptarget]');
  if(wrap){
    const area = wrap.dataset.area, g = GRIDS[area]; if(!g) return;
    const rect = wrap.getBoundingClientRect();
    let x = Math.floor((e.clientX - rect.left)/g.cell), yT = Math.floor((e.clientY - rect.top)/g.cell);
    let y = area==='belt' ? (+(wrap.dataset.disp||1) - 1 - yT) : yT;
    x = Math.max(0, Math.min(g.cols - P.item.w, x)); y = Math.max(0, y);
    const chk = gridCheck(area, P.item, x, y, P.id);
    P.drop = {kind:'grid', area, x, y, ok:chk.ok, reason:chk.reason};
    const hl = wrap.querySelector('.drop-hl');
    if(hl){ hl.style.display='block'; hl.style.left=(x*g.cell)+'px'; hl.style.top=((area==='belt'? (+(wrap.dataset.disp||1)-1-y) : y)*g.cell)+'px'; hl.style.width=(P.item.w*g.cell)+'px'; hl.style.height=(P.item.h*g.cell)+'px'; hl.classList.toggle('bad', !chk.ok); }
    ghost.classList.toggle('bad', !chk.ok); return;
  }
  ghost.classList.add('bad');
}
function cleanupDragVisual(){
  ghost.style.display='none'; clearHl();
  if(P && P.el){ P.el.classList.remove('drag-src'); P.el.style.pointerEvents=''; }
}
function endDrag(e){
  const d = P.drop, item = P.item;
  cleanupDragVisual();
  if(d && d.ok){
    const loc = locateItem(P.area, P.id); if(!loc){ render(); return; }
    if(d.kind==='tray'){ toTray(loc); return; }
    if(d.kind==='slot'){
      const occ = slotItem(d.area, d.loc);
      loc.remove();
      if(occ && d.swap){
        if(P.srcLoc){ slotSet(P.area, P.srcLoc, occ); }
        else if(P.srcGridItem){ occ.x = P.srcGridItem.x; occ.y = P.srcGridItem.y; GRIDS[P.area].get().push(occ); }
      }
      slotSet(d.area, d.loc, item);
    } else if(d.kind==='grid'){
      loc.remove();
      if(d.area==='belt'){ cur().belt[d.y*4 + d.x] = item; }
      else { item.x = d.x; item.y = d.y; GRIDS[d.area].get().push(item); }
    }
    flashSave(); render(); return;
  }
  /* 落空：回滚 */
  if(d && d.reason) toast(d.reason);
  if(P.fromTray){ openTray(); const h=$('#trayhandle'); h.classList.remove('bump'); void h.offsetWidth; h.classList.add('bump'); }
}
function cancelDrag(){ cleanupDragVisual(); if(P && P.fromTray) openTray(); }
function dblAction(area, id){
  if(area==='tray'){ fromTrayTo(S.activeGrid, id); return; }
  const loc = locateItem(area, id); if(loc) toTray(loc);
}
/* ================= init ================= */
render();
</script>
